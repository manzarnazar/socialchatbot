# WhatsOmni Production Docker Compose Configuration
name: whatsomni

services:
  # -------------------------------------------------------------
  # 1. Ingress Reverse Proxy (Nginx)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: whatsomni_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage/app:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - reverb
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 2. Frontend Web App (Next.js Standalone)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
        NEXT_PUBLIC_REVERB_APP_KEY: ${REVERB_APP_KEY:-whatsomni_reverb_key}
        NEXT_PUBLIC_REVERB_HOST: ${REVERB_HOST:-localhost}
        NEXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-80}
        NEXT_PUBLIC_REVERB_SCHEME: ${REVERB_SCHEME:-http}
    image: whatsomni_frontend:latest
    container_name: whatsomni_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 128M
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
      - NEXT_PUBLIC_REVERB_APP_KEY=${REVERB_APP_KEY:-whatsomni_reverb_key}
      - NEXT_PUBLIC_REVERB_HOST=${REVERB_HOST:-localhost}
      - NEXT_PUBLIC_REVERB_PORT=${REVERB_PORT:-80}
      - NEXT_PUBLIC_REVERB_SCHEME=${REVERB_SCHEME:-http}
    depends_on:
      - backend
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 3. Backend API (Laravel 11 PHP-FPM)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: whatsomni_backend:latest
    container_name: whatsomni_backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    environment:
      - CONTAINER_ROLE=app
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
      - CACHE_ON_STARTUP=${CACHE_ON_STARTUP:-true}
      - APP_NAME=${APP_NAME:-WhatsOmni}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - SANCTUM_STATEFUL_DOMAINS=${SANCTUM_STATEFUL_DOMAINS:-localhost,127.0.0.1}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-whatsomni}
      - DB_USERNAME=${DB_USERNAME:-whatsomni}
      - DB_PASSWORD=${DB_PASSWORD:-whatsomni_secret}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-whatsomni_reverb_id}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-whatsomni_reverb_key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-whatsomni_reverb_secret}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-80}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.mailgun.org}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@whatsomni.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-WhatsOmni}
      - RESEND_API_KEY=${RESEND_API_KEY:-null}
      - BAILEYS_WORKER_URL=${BAILEYS_WORKER_URL:-http://baileys:5006}
      - BAILEYS_SECRET_TOKEN=${BAILEYS_SECRET_TOKEN:-whatsomni_baileys_secret_key}
      - SCOUT_DRIVER=${SCOUT_DRIVER:-collection}
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-http://127.0.0.1:7700}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-masterKey123}
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 4. Laravel Queue Worker
  # -------------------------------------------------------------
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: whatsomni_backend:latest
    container_name: whatsomni_queue
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - CONTAINER_ROLE=queue
      - APP_NAME=${APP_NAME:-WhatsOmni}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-whatsomni}
      - DB_USERNAME=${DB_USERNAME:-whatsomni}
      - DB_PASSWORD=${DB_PASSWORD:-whatsomni_secret}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-whatsomni_reverb_id}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-whatsomni_reverb_key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-whatsomni_reverb_secret}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-80}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - BAILEYS_WORKER_URL=${BAILEYS_WORKER_URL:-http://baileys:5006}
      - BAILEYS_SECRET_TOKEN=${BAILEYS_SECRET_TOKEN:-whatsomni_baileys_secret_key}
      - SCOUT_DRIVER=${SCOUT_DRIVER:-collection}
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-http://127.0.0.1:7700}
      - MEILISEARCH_KEY=${MEILISEARCH_KEY:-masterKey123}
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 5. Laravel Reverb WebSocket Server
  # -------------------------------------------------------------
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: whatsomni_backend:latest
    container_name: whatsomni_reverb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    environment:
      - CONTAINER_ROLE=reverb
      - APP_NAME=${APP_NAME:-WhatsOmni}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-whatsomni}
      - DB_USERNAME=${DB_USERNAME:-whatsomni}
      - DB_PASSWORD=${DB_PASSWORD:-whatsomni_secret}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=${REVERB_APP_ID:-whatsomni_reverb_id}
      - REVERB_APP_KEY=${REVERB_APP_KEY:-whatsomni_reverb_key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-whatsomni_reverb_secret}
      - REVERB_HOST=${REVERB_HOST:-localhost}
      - REVERB_PORT=${REVERB_PORT:-80}
      - REVERB_SCHEME=${REVERB_SCHEME:-http}
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=8080
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 6. Task Scheduler (Cron)
  # -------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: whatsomni_backend:latest
    container_name: whatsomni_scheduler
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    environment:
      - CONTAINER_ROLE=scheduler
      - APP_NAME=${APP_NAME:-WhatsOmni}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-whatsomni}
      - DB_USERNAME=${DB_USERNAME:-whatsomni}
      - DB_PASSWORD=${DB_PASSWORD:-whatsomni_secret}
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCOUT_DRIVER=${SCOUT_DRIVER:-collection}
    volumes:
      - backend_storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 7. WhatsApp Baileys Microservice
  # -------------------------------------------------------------
  baileys:
    build:
      context: ./baileys-worker
      dockerfile: Dockerfile
    image: whatsomni_baileys:latest
    container_name: whatsomni_baileys
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M
    environment:
      - PORT=5006
      - LARAVEL_API_URL=${LARAVEL_API_URL:-http://nginx:80}
      - BAILEYS_SECRET_TOKEN=${BAILEYS_SECRET_TOKEN:-whatsomni_baileys_secret_key}
    volumes:
      - baileys_sessions:/app/storage/sessions
    depends_on:
      - backend
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 8. MySQL Database 8.0 (Optimized Buffer Pool & Performance Schema)
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: whatsomni_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=16M
      --innodb-flush-log-at-trx-commit=2
      --max-connections=100
      --table-open-cache=400
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-whatsomni}
      MYSQL_USER: ${DB_USERNAME:-whatsomni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-whatsomni_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DB_USERNAME:-whatsomni} -p${DB_PASSWORD:-whatsomni_secret} || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - whatsomni_network

  # -------------------------------------------------------------
  # 9. Redis Cache & Queue Broker
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: whatsomni_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - whatsomni_network

# -------------------------------------------------------------
# Persistent Volumes & Networks
# -------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  baileys_sessions:
    driver: local
  backend_storage:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  whatsomni_network:
    driver: bridge
