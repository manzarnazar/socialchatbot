# WhatsOmni Development Nginx Ingress Configuration

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_fpm {
    server backend:9000;
}

upstream reverb_upstream {
    server reverb:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    client_max_body_size 100M;

    # Laravel Reverb WebSockets (/app)
    location /app {
        proxy_pass http://reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Static Storage
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel API, Sanctum, Broadcasting routes
    location ~ ^/(api|sanctum|broadcasting|live-chat|webhooks)/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?$query_string;

        location ~ \.php$ {
            fastcgi_pass backend_fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_read_timeout 300;
        }
    }

    # Next.js Frontend Application
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
